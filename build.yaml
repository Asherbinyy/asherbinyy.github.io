targets:
  $default:
    builders:
      # Riverpod 2's analyzer cannot summarize Flutter 3.47's newer syntax.
      # Keep generated providers pure Dart; pass framework values as inputs.
      # https://github.com/dart-lang/sdk/issues/61870
      riverpod_generator:
        generate_for:
          - lib/core/platform/platform_provider.dart
          - lib/core/platform/message_controller.dart
      freezed:
        generate_for:
          - lib/content/models/**.dart
      json_serializable:
        generate_for:
          - lib/content/models/**.dart
