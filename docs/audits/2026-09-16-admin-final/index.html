<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin release review</title>
  <style>
    body { margin: 0; padding: 32px; color: #edf1f8; background: #121826; font: 16px/1.5 system-ui, sans-serif; }

    p { color: #a8b4c6; }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }

    img { display: block; width: 100%; height: auto; border: 1px solid #2e3a50; }
    figcaption { padding-top: 12px; }

</head>
<body>
  <h1>Admin release review</h1>
  <p>Real Flutter preview, current content, desktop and phone layouts. <a href="checks.json">Automated browser results</a>.</p>
  <main>
    <figure><img src="overview-desktop.png" alt="Admin overview with disabled analytics state"><figcaption>Overview — honest disabled analytics state</figcaption></figure>
    <figure><img src="home-preview-half.png" alt="Home editor with half-screen website preview"><figcaption>Home — half-screen real website preview</figcaption></figure>
    <figure><img src="home-preview-third.png" alt="Home editor with third-screen website preview"><figcaption>Home — one-third preview option</figcaption></figure>
    <figure><img src="navigation-minimized.png" alt="Admin with the navigation minimized"><figcaption>Navigation minimized independently</figcaption></figure>
    <figure><img src="preview-minimized.png" alt="Admin with the preview minimized"><figcaption>Preview minimized independently</figcaption></figure>
    <figure><img src="draft-preview.png" alt="A private draft rendered in the portfolio preview"><figcaption>Private draft rendered by the actual Flutter site</figcaption></figure>

    <figure><img src="page-work-1440.png" alt="Work editor on desktop"><figcaption>Work — desktop</figcaption></figure>
    <figure><img src="page-about-1440.png" alt="About editor on desktop"><figcaption>About — desktop</figcaption></figure>
    <figure><img src="page-home-390.png" alt="Home editor on a phone-width viewport"><figcaption>Home — phone width</figcaption></figure>
    <figure><img src="page-account-390.png" alt="Account controls on a phone-width viewport"><figcaption>Account — phone width</figcaption></figure>
  </main>
</body>
</html>
