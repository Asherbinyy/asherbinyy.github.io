name: nocturne
description: Personal portfolio foundation.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.2"

dependencies:
  audioplayers: ^6.1.0         # game sound effects only
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.0
  flutter_svg: ^2.0.0
  freezed_annotation: ^2.4.0
  go_router: ^14.0.0
  http: ^1.2.0                 # Medium RSS, analytics beacon
  intl: any                 # let flutter_localizations pin this
  json_annotation: ^4.9.0
  material_ui: ^1.1.0
  meta: any                 # so the game's physics needs no Flutter to run
  riverpod_annotation: ^2.6.0
  shared_preferences: ^2.3.0   # theme + consent persistence only
  simple_icons: ^16.23.0        # the platforms' own marks, drawn from their brand sets
  url_launcher: ^6.3.0
  xml: ^6.5.0                  # RSS parse

# Pinned against the SDK, not preference.
#
# `pubspec.lock` is deliberately not committed -- the SDK is pinned by `.fvmrc`
# instead -- so every CI run resolves fresh and takes whatever was published
# since. objective_c 9.6.1 reaches for a `code_assets` member (`arm64e`) that
# Flutter 3.47.2 does not have, and its build hook fails before a single test
# runs. It arrives transitively, so a constraint has to be an override.
#
# Remove this the day the pinned SDK moves.
dependency_overrides:
  objective_c: 9.5.0

dev_dependencies:
  alchemist: ^0.11.0
  build_runner: ^2.4.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  mocktail: ^1.0.0
  riverpod_generator: ^2.6.0
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/
    - assets/brand/
    - assets/maps/
    - assets/media/
    - assets/media/interests/
    - assets/media/apps/
    - assets/media/apps/minextstep/
    - assets/docs/
    - assets/audio/
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium-subset.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold-subset.ttf
          weight: 700
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular-subset.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium-subset.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold-subset.ttf
          weight: 600
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular-subset.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium-subset.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold-subset.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular-subset.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium-subset.ttf
          weight: 500
