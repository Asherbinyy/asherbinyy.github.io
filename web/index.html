<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <!--
    Hand-authored shell for the Flutter web app.
    Static <title> is what search engines and the very first paint see.
    The app updates the title per route via SystemChrome / router.dart.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Zoomable, like every other page on the machine. Scaling is allowed
       rather than pinned: a portfolio nobody can enlarge is a portfolio some
       people cannot read. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#121826">
  <meta name="description" content="I build mobile products end to end, from the first idea to the release notes. Manchester, United Kingdom.">
  <meta name="author" content="Ahmed Elsherbini">

  <!-- Open Graph -->

  <meta property="og:description" content="I build mobile products end to end, from the first idea to the release notes.">
  <meta property="og:url" content="https://lsherbini.github.io/">

  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ahmed Elsherbini">

  <!-- Favicon -->

  <title>Ahmed Elsherbini, Mobile Application Developer, Manchester</title>
  <link rel="manifest" href="manifest.json">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Ahmed Elsherbini",
    "jobTitle": "Mobile Application Developer",

    "email": "ahmed.elsherbini.tech@gmail.com",
    "sameAs": [

    ],
    "alumniOf": [
      {

  <style>
    /*
      The overlay's own styling, inline because it must paint on the first
      frame: a threshold that arrives after a flash of the app is not a
      threshold. Kept to the same tokens as the app so the handoff is seamless.
    */
    :root { color-scheme: dark; }
    html.threshold-locked, html.threshold-locked body { overflow: hidden; }
    .threshold {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #121826;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 1;
      transition: opacity 620ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .threshold--gone { opacity: 0; pointer-events: none; }
    .threshold canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .threshold__frame {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 0 20px 9vh;
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #EDF1F8;
      /* Faded in only once the scene is behind it, so a failed WebGL context
         never leaves floating text over a flat colour. */
      opacity: 0;
      transition: opacity 500ms ease 260ms;
    }
    .threshold--ready .threshold__frame { opacity: 1; }
    .threshold--gone .threshold__frame { opacity: 0; transition-delay: 0ms; }
    /* The way in. The owner asked for a button here rather than his name --
       the name is the first thing the site itself says, and saying it twice
       before the page had even loaded was a title card for nobody.

       It is dressed as the door it opens: a gold rule either side, a wide
       tracked word between them, and a breath of lamplight behind it that
       comes up as the scene does. A default browser button with a border sat
       on this scene like a form control, which is what the owner objected
       to. */
    .threshold__enter {
      position: relative;
      margin-top: 30px;
      padding: 15px 44px;
      font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.34em;
      text-indent: 0.34em;
      text-transform: uppercase;
      color: #E8C77A;
      background: linear-gradient(180deg, rgba(227,169,63,0.10), rgba(227,169,63,0.02));
      border: 0;
      border-top: 1px solid rgba(227, 169, 63, 0.55);
      border-bottom: 1px solid rgba(227, 169, 63, 0.55);
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      box-shadow: 0 0 34px -12px rgba(227, 169, 63, 0.75);
      transition: color 260ms ease, letter-spacing 260ms ease,
                  background 260ms ease, box-shadow 260ms ease;
    }
    /* The jambs. Two thin uprights that close the frame around the word, so
       it reads as a doorway rather than as a pill. */
    .threshold__enter::before,
    .threshold__enter::after {
      content: '';
      position: absolute;
      top: 6px;
      bottom: 6px;
      width: 1px;
      background: rgba(227, 169, 63, 0.35);
      transition: background 260ms ease, top 260ms ease, bottom 260ms ease;
    }
    .threshold__enter::before { left: 14px; }
    .threshold__enter::after { right: 14px; }
    .threshold__enter:hover,
    .threshold__enter:focus-visible {
      color: #1A1208;
      background: linear-gradient(180deg, #F0C265, #E3A93F);
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      box-shadow: 0 0 52px -8px rgba(227, 169, 63, 0.95);
      outline: none;
    }
    .threshold__enter:hover::before,
    .threshold__enter:hover::after,
    .threshold__enter:focus-visible::before,
    .threshold__enter:focus-visible::after {
      top: 0;
      bottom: 0;
      background: rgba(26, 18, 8, 0.45);
    }
    @media (prefers-reduced-motion: reduce) {
      .threshold__enter { transition: none; }
      .threshold__enter::before,
      .threshold__enter::after { transition: none; }
    }
    .threshold__title {
      margin: 0 0 6px;
      font-size: clamp(26px, 5vw, 44px);
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    /* The title leaves before the doors do, so the frame is clear for the
       camera move rather than competing with it. */
    .threshold--opening .threshold__frame { opacity: 0; transition-duration: 320ms; }
    /* Someone who asked for less motion is shown nothing here at all; the
       script removes the overlay before a frame is drawn. */
    @media (prefers-reduced-motion: reduce) { .threshold { display: none; } }
  </style>
</head>
<body>
  <!--
    The threshold. A buried temple in the Sahara, rendered in WebGL before the
    app mounts, because the shell is the one place on this site where real 3D
    is possible: Flutter draws to a single canvas and cannot host a scene.

    It is markup first and script second on purpose. With JavaScript disabled,
    or a module import blocked, this is a static panel with a heading and two
    ordinary buttons, and the script removes it. Nothing here is required to
    reach the site.
  -->
  <div id="threshold" class="threshold">
    <!-- Decorative staging. Artwork attribution is linked from About. -->
    <div class="threshold__frame">
      <h1 class="threshold__title" aria-hidden="true">The door is sealed.</h1>
      <button type="button" class="threshold__enter" id="threshold-enter">
        Enter
      </button>
    </div>
  </div>

  <script>
    // Keep the layout still while the browser magnifies it.
    //
    // A pinch changes the *visual* viewport, not the layout one. On an
    // ordinary page that is a magnifier: the layout is untouched and the
    // browser scales the pixels it already painted.
    //
    // Flutter measures itself from `visualViewport.width/height` whenever it
    // recomputes -- see FullPageDimensionsProvider.computePhysicalSize -- so a
    // pinch shrank its canvas to the magnified region and relaid the site out
    // underneath the magnifying glass, which is the black margin the owner
    // photographed. Muting the resize *event* did not help, because the read
    // is direct and happens on any frame.
    //
    // The same method falls back to `window.innerWidth/innerHeight` when there
    // is no visual viewport, and those are the layout viewport: unchanged by a
    // pinch, and correctly updated by a real browser zoom (cmd +/-), which
    // should relayout. So the property is hidden from everything that runs
    // after this, and Flutter takes the fallback.
    //
    // What this gives up is the on-screen-keyboard inset on mobile, computed
    // from the same object. This site has no text input for a keyboard to
    // cover.
    (() => {
      try {
        Object.defineProperty(window, 'visualViewport', {
          configurable: true,
          get: () => undefined,
        });
      } catch (_) {
        // A browser that will not let it be shadowed keeps the old behaviour.
      }
    })();

    // Let the browser zoom.
    //
    // A trackpad pinch on macOS, and ctrl with the wheel anywhere, arrive as a
    // wheel event carrying ctrlKey. Flutter's own listener calls
    // preventDefault on wheel events so it can own scrolling, and that also
    // cancels the browser's page zoom -- which is why this site was the one
    // page that would not pinch when every other one did.
    //
    // Caught on the way down and stopped before it reaches the view, so the
    // browser does what it does everywhere else. Ordinary scrolling carries no
    // ctrlKey and is not touched, so nothing about the page's own scrolling
    // changes.
    window.addEventListener(
      'wheel',
      (event) => {
        if (event.ctrlKey) event.stopPropagation();
      },
      { capture: true, passive: true },
    );
  </script>

  <script src="flutter_bootstrap.js" async></script>
  <script type="module" src="intro/threshold.js"></script>
</body>
</html>
