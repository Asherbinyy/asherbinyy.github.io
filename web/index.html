<head>
  <!--
    Hand-authored shell for the Flutter web app.
    Static <title> is what search engines and the very first paint see.
    The app updates the title per route via SystemChrome / router.dart.
  -->

       rather than pinned: a portfolio nobody can enlarge is a portfolio some
       people cannot read. -->

  <style>
    /*
      The overlay's own styling, inline because it must paint on the first
      frame: a threshold that arrives after a flash of the app is not a
      threshold. Kept to the same tokens as the app so the handoff is seamless.
    */
    :root { color-scheme: dark; }
    html.threshold-locked, html.threshold-locked body { overflow: hidden; }
    .threshold {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #121826;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 1;
      transition: opacity 620ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .threshold--gone { opacity: 0; pointer-events: none; }
    .threshold canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .threshold__frame {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 0 20px 9vh;
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #EDF1F8;
      /* Faded in only once the scene is behind it, so a failed WebGL context
         never leaves floating text over a flat colour. */
      opacity: 0;
      transition: opacity 500ms ease 260ms;
    }
    .threshold--ready .threshold__frame { opacity: 1; }
    .threshold--gone .threshold__frame { opacity: 0; transition-delay: 0ms; }
    /* The panel is the control now, so it shows a pointer and takes focus
       without a visible outline fighting the scene. The Enter button that used
       to live here is gone at the owner's request, along with its jambs and
       hover states -- about sixty lines of CSS for a control that no longer
       exists. */
    .threshold { cursor: pointer; }
    .threshold:focus { outline: none; }
    .threshold:focus-visible {
      outline: 1px solid rgba(227, 169, 63, 0.55);
      outline-offset: -3px;
    }
    .threshold__title {
      margin: 0 0 6px;
      font-size: clamp(26px, 5vw, 44px);
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    /* The title leaves before the doors do, so the frame is clear for the
       camera move rather than competing with it. */
    .threshold--opening .threshold__frame { opacity: 0; transition-duration: 320ms; }
    /* Someone who asked for less motion is shown nothing here at all; the
       script removes the overlay before a frame is drawn. */
    @media (prefers-reduced-motion: reduce) { .threshold { display: none; } }
  </style>
</head>
<body>
  <!--
    The threshold. A buried temple in the Sahara, rendered in WebGL before the
    app mounts, because the shell is the one place on this site where real 3D
    is possible: Flutter draws to a single canvas and cannot host a scene.

    The owner asked for the button to go. It was there because a sealed door
    with no handle is a wait; it is gone because a button is the first thing an
    eye lands on and the scene is the point. What replaces it is not nothing:
    the whole panel is the handle now, a click or any key opens the door, and
    it still opens on its own for somebody who does neither.

    The `noscript` rule matters more than it looks. With JavaScript disabled
    the script that removes this never runs, and the button never worked
    either, so the panel used to be a locked door with a handle painted on it.
    Now it is simply not rendered and the site loads underneath.
  -->
  <noscript><style>.threshold { display: none !important; }</style></noscript>
  <div id="threshold" class="threshold" role="button" tabindex="0"
       aria-label="Enter the site">
    <!-- Decorative staging. Artwork attribution is linked from About. -->
    <div class="threshold__frame">
      <h1 class="threshold__title" aria-hidden="true">The door is sealed.</h1>
    </div>
  </div>

  <script>
    // Keep the layout still while the browser magnifies it.
    //
    // A pinch changes the *visual* viewport, not the layout one. On an
    // ordinary page that is a magnifier: the layout is untouched and the
    // browser scales the pixels it already painted.
    //
    // Flutter measures itself from `visualViewport.width/height` whenever it
    // recomputes -- see FullPageDimensionsProvider.computePhysicalSize -- so a
    // pinch shrank its canvas to the magnified region and relaid the site out
    // underneath the magnifying glass, which is the black margin the owner
    // photographed. Muting the resize *event* did not help, because the read
    // is direct and happens on any frame.
    //
    // The same method falls back to `window.innerWidth/innerHeight` when there
    // is no visual viewport, and those are the layout viewport: unchanged by a
    // pinch, and correctly updated by a real browser zoom (cmd +/-), which
    // should relayout. So the property is hidden from everything that runs
    // after this, and Flutter takes the fallback.
    //
    // What this gives up is the on-screen-keyboard inset on mobile, computed
    // from the same object. This site has no text input for a keyboard to
    // cover.
    (() => {
      try {
        Object.defineProperty(window, 'visualViewport', {
          configurable: true,
          get: () => undefined,
        });
      } catch (_) {
        // A browser that will not let it be shadowed keeps the old behaviour.
      }
    })();

    // Let the browser zoom.
    //
    // A trackpad pinch on macOS, and ctrl with the wheel anywhere, arrive as a
    // wheel event carrying ctrlKey. Flutter's own listener calls
    // preventDefault on wheel events so it can own scrolling, and that also
    // cancels the browser's page zoom -- which is why this site was the one
    // page that would not pinch when every other one did.
    //
    // Caught on the way down and stopped before it reaches the view, so the
    // browser does what it does everywhere else. Ordinary scrolling carries no
    // ctrlKey and is not touched, so nothing about the page's own scrolling
    // changes.
    window.addEventListener(
      'wheel',
      (event) => {
        if (event.ctrlKey) event.stopPropagation();
      },
      { capture: true, passive: true },
    );

    // A knob the climb can turn: how many physical pixels the browser
    // reports itself as having per logical one.
    //
    // Flutter Web keeps one canvas for the whole app, sized at
    // window.devicePixelRatio times its logical size, and the engine reads
    // that value live every time it recomputes -- see
    // EngineFlutterDisplay.devicePixelRatio in the SDK. On a 3x-class phone
    // that canvas is nine times the pixels of a 1x screen the same CSS
    // size, and the climb draws enough masonry, register bands and dust
    // every frame that filling all of them is what made it lag specifically
    // on a phone and not on a desktop with the same page open: a phone's
    // GPU pays for that fill far more than a desktop's does.
    //
    // A per-widget RepaintBoundary/Transform.scale trick was tried first and
    // measured to do nothing, for the same reason: there is only the one
    // canvas, and nothing short of what it is actually asked to allocate
    // changes how many pixels get filled. This is that lever, and it is
    // scoped to while the climb is open rather than applied to the whole
    // site, so the rest of the page keeps native sharpness on a high-DPI
    // phone.
    (() => {
      let realDpr = null;
      window.__ascentCapDpr = (cap) => {
        if (realDpr !== null) return;
        const real = window.devicePixelRatio;
        if (real <= cap) return;
        realDpr = real;
        try {
          Object.defineProperty(window, 'devicePixelRatio', {
            configurable: true,
            get: () => cap,
          });
        } catch (_) {
          realDpr = null;
          return;
        }
        // The engine only re-reads devicePixelRatio when it recomputes its
        // canvas size, which happens on a resize event.
        window.dispatchEvent(new Event('resize'));
      };
      window.__ascentRestoreDpr = () => {
        if (realDpr === null) return;
        const restored = realDpr;
        realDpr = null;
        Object.defineProperty(window, 'devicePixelRatio', {
          configurable: true,
          get: () => restored,
        });
        window.dispatchEvent(new Event('resize'));
      };
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
  <script type="module" src="intro/threshold.js"></script>
</body>
</html>
