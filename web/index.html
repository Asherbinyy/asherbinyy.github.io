<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <!--
    Hand-authored shell for the Flutter web app.
    Static <title> is what search engines and the very first paint see.
    The app updates the title per route via SystemChrome / router.dart.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121826">
  <meta name="description" content="Mobile engineer. 25+ applications shipped across six countries. Flutter, Dart, Swift — Manchester, UK.">
  <meta name="author" content="Ahmed Elsherbini">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ahmed Elsherbini — Mobile Engineer">
  <meta property="og:description" content="Mobile engineer. 25+ applications shipped across six countries.">
  <meta property="og:url" content="https://asherbinyy.github.io/">
  <meta property="og:image" content="https://asherbinyy.github.io/icons/icon-512.png">
  <meta property="og:site_name" content="Ahmed Elsherbini">
  <meta property="og:locale" content="en_GB">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Ahmed Elsherbini — Mobile Engineer">
  <meta name="twitter:description" content="Mobile engineer. 25+ applications shipped across six countries.">
  <meta name="twitter:image" content="https://asherbinyy.github.io/icons/icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Ahmed Elsherbini">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Canonical -->
  <link rel="canonical" href="https://asherbinyy.github.io/">

  <title>Ahmed Elsherbini — Mobile Engineer, Manchester</title>
  <link rel="manifest" href="manifest.json">

  <!-- JSON-LD Person schema — visible to search engines before the app mounts -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Ahmed Elsherbini",
    "jobTitle": "Mobile Engineer",
    "url": "https://asherbinyy.github.io",
    "email": "ahmed.elsherbini.tech@gmail.com",
    "sameAs": [
      "https://www.linkedin.com/in/ahmedelsherbini/",
      "https://github.com/Asherbinyy",
      "https://gitlab.com/sherbini",
      "https://sherbini.medium.com/"
    ],
    "alumniOf": [
      {
        "@type": "CollegeOrUniversity",
        "name": "University of Salford"
      },
      {
        "@type": "CollegeOrUniversity",
        "name": "Mansoura University"
      }
    ],
    "knowsAbout": [
      "Flutter", "Dart", "Mobile Engineering", "Swift", "SwiftUI",
      "UIKit", "Firebase", "REST APIs", "CI/CD", "Clean Architecture"
    ],
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Manchester",
      "addressCountry": "GB"
    }
  }
  </script>
  <style>
    /*
      The overlay's own styling, inline because it must paint on the first
      frame: a threshold that arrives after a flash of the app is not a
      threshold. Kept to the same tokens as the app so the handoff is seamless.
    */
    :root { color-scheme: dark; }
    html.threshold-locked, html.threshold-locked body { overflow: hidden; }
    .threshold {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #121826;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 1;
      transition: opacity 620ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .threshold--gone { opacity: 0; pointer-events: none; }
    .threshold canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .threshold__frame {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 0 20px 9vh;
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #EDF1F8;
      /* Faded in only once the scene is behind it, so a failed WebGL context
         never leaves floating text over a flat colour. */
      opacity: 0;
      transition: opacity 500ms ease 260ms;
    }
    .threshold--ready .threshold__frame { opacity: 1; }
    .threshold--gone .threshold__frame { opacity: 0; transition-delay: 0ms; }
    .threshold__eyebrow {
      margin: 0 0 10px;
      font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #E3A93F;
    }
    .threshold__title {
      margin: 0 0 6px;
      font-size: clamp(26px, 5vw, 44px);
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .threshold__hint { margin: 0 0 22px; font-size: 15px; color: #A8B4C6; }
    .threshold__actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .threshold__enter, .threshold__skip {
      font: inherit;
      font-size: 15px;
      padding: 12px 26px;
      border-radius: 6px;
      cursor: pointer;
      min-height: 48px;
      transition: transform 160ms ease, background 160ms ease;
    }
    .threshold__enter { background: #E3A93F; color: #121826; border: none; font-weight: 600; }
    .threshold__skip { background: transparent; color: #A8B4C6; border: 1px solid #3F4D66; }
    .threshold__enter:hover { transform: translateY(-1px); background: #FFD98A; }
    .threshold__skip:hover { color: #EDF1F8; border-color: #A8B4C6; }
    .threshold__enter:focus-visible, .threshold__skip:focus-visible {
      outline: 2px solid #E3A93F;
      outline-offset: 3px;
    }
    /* Someone who asked for less motion is shown nothing here at all; the
       script removes the overlay before a frame is drawn. */
    @media (prefers-reduced-motion: reduce) { .threshold { display: none; } }
  </style>
</head>
<body>
  <!--
    The threshold. A buried temple in the Sahara, rendered in WebGL before the
    app mounts, because the shell is the one place on this site where real 3D
    is possible: Flutter draws to a single canvas and cannot host a scene.

    It is markup first and script second on purpose. With JavaScript disabled,
    or a module import blocked, this is a static panel with a heading and two
    ordinary buttons, and the script removes it. Nothing here is required to
    reach the site.
  -->
  <div id="threshold" class="threshold" role="dialog" aria-label="Enter">
    <div class="threshold__frame">
      <p class="threshold__eyebrow">Ahmed Elsherbini</p>
      <h1 class="threshold__title">The door is sealed.</h1>
      <p class="threshold__hint">Strike the ground to open it.</p>
      <div class="threshold__actions">
        <button type="button" class="threshold__enter">Enter</button>
        <button type="button" class="threshold__skip">Skip</button>
      </div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script type="module" src="intro/threshold.js"></script>
</body>
</html>
