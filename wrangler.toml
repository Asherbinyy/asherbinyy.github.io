name = "nocturne-analytics"
main = "worker/src/index.js"
compatibility_date = "2026-09-05"
workers_dev = true
preview_urls = false
send_metrics = false

[vars]
SITE_ID = "asherbinyy.github.io"
SITE_ORIGIN = "https://asherbinyy.github.io"
# The owner's Medium handle comes from profile.json's contact block; "/feed" is
# Medium's own convention for the RSS of a publication or profile.
WRITING_FEED_URL = "https://sherbini.medium.com/feed"

[triggers]
crons = ["0 0 * * *", "0 1-23 * * *"]

[observability.logs]
enabled = false

[[kv_namespaces]]
binding = "ANALYTICS"
id = "f93e4a6cc18b499f89eb67b743b3e0db"

# Content the owner publishes from the admin panel. Commented out because the
# namespace has to be created first and its id pasted here:
#
#   npx wrangler kv namespace create CONTENT
#
# Until then the Worker deploys and runs exactly as before: `/v1/content/*`
# returns 404, the site reads its bundle, and the admin write endpoints answer
# 503 rather than pretending to have stored anything. Separate from ANALYTICS
# on purpose -- every key in that namespace expires, and published content must
# not.
#
# [[kv_namespaces]]
# binding = "CONTENT"
# id = "paste-the-id-from-the-command-above"
